name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun i
      # First: the Next.js example resolves floating-ellipsis to dist/, for lint and tsc alike.
      - run: bun run build
      - run: bun check
      - run: bun run test
      - run: bun typecheck
      - run: bun run size

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun i
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run test:browser
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-screenshots
          path: .vitest/attachments

  next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
      - run: bun i
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run test:next
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: next-traces
          path: examples/next/test-results
