<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>floating-ellipsis — auto-sized elements</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      .modes {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px;
      }
      .mode {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px;
        min-width: 0;
      }
      .mode h2 {
        font: 500 13px/1 var(--mono);
        color: var(--accent);
        margin: 0 0 4px;
      }
      .mode p {
        font-size: 13px;
        color: var(--muted);
        margin: 0 0 12px;
      }
      .room {
        outline: 1px dashed var(--line);
        margin-bottom: 14px;
        min-width: 0;
        max-width: 100%;
      }
      .label {
        font: 12px/1 var(--mono);
        color: var(--muted);
        margin: 0 0 6px;
      }
      .chip {
        display: inline-block;
        max-width: 100%;
        padding: 0 8px;
        border-radius: 999px;
        background: var(--accent-2-soft);
      }
      .row {
        display: flex;
        gap: 6px;
        align-items: baseline;
      }
      .row .item {
        flex: 0 1 auto;
        min-width: 0;
        background: var(--accent-soft);
      }
      .row .badge {
        font: 11px/1 var(--mono);
        color: var(--muted);
        flex: none;
      }
      .two {
        display: inline-block;
        background: var(--accent-2-soft);
      }
      .width {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
        font: 13px/1 var(--mono);
      }
    </style>
  </head>
  <body>
    <header class="intro">
      <p class="eyebrow"><a href="./">floating-ellipsis</a> <span>/ auto-sized</span></p>
      <h1>Sized by <em>content.</em></h1>
      <p class="lede">
        Elements whose width comes from their text: a chip, a flex item beside a badge, and an inline-block on two lines with nothing
        capping its width. Narrow the room, then widen it again: without <code>autoSize</code>, they stay narrow.
      </p>
    </header>
    <main class="block wide">
      <label class="width"
        >Room <input id="width" type="range" min="60" max="420" value="160" /> <output id="width-out">160px</output></label
      >
      <div class="modes" id="modes"></div>
    </main>
    <script type="module" src="./autosize.ts"></script>
  </body>
</html>
