<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>floating-ellipsis — cases</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Mona+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: rgb(11, 11, 11);
        --muted: rgb(137, 135, 129);
        --heading: rgb(82, 81, 78);
        --line: rgb(11 11 11 / 0.1);
        font:
          400 13px/19px system-ui,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        color: var(--ink);
      }
      body {
        margin: 0;
        padding: 12px;
        background: rgb(252, 252, 251);
      }
      .case {
        width: fit-content;
        padding: 20px 24px 24px;
      }
      .source {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin: 0 0 18px 4px;
      }
      .source b {
        font-size: 15px;
        font-weight: 600;
      }
      .source span {
        color: var(--muted);
      }
      .compare {
        display: flex;
        gap: 32px;
        align-items: flex-start;
      }
      figure {
        margin: 0;
      }
      figcaption {
        margin: 0 0 10px 4px;
        font-size: 12px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .panel {
        width: 380px;
        padding-bottom: 12px;
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 0 0 1px var(--line);
      }
      .head {
        display: flex;
        align-items: center;
        height: 32px;
        padding: 0 4px 0 8px;
      }
      .head h2 {
        flex: 1;
        margin: 0;
        padding-left: 4px;
        font: inherit;
        color: var(--heading);
      }
      .icon {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        margin-left: 2px;
      }
      .section {
        display: flex;
        align-items: center;
        gap: 4px;
        margin: 10px 19px 6px;
        font-size: 12px;
        font-weight: 400;
        line-height: 15px;
        color: var(--muted);
      }
      .rows {
        margin: 0 19px;
        padding: 0;
        list-style: none;
      }
      .rows li {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 35px;
        border-bottom: 0.6px solid var(--line);
      }
      .label {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .folder {
        padding: 1px 5px;
        border-radius: 4px;
        background: rgb(11 11 11 / 0.06);
        color: var(--heading);
      }
      .meta {
        flex: none;
        font-size: 12px;
        line-height: 15px;
        color: var(--muted);
      }
      .end {
        flex: none;
        display: grid;
        place-items: center;
        width: 20px;
        color: var(--muted);
      }

      /* GitHub's pull request file tree (Primer's ActionList), as on github.com. */
      .gh .tree {
        position: relative;
        width: 296px;
        margin: 0;
        padding: 8px 0;
        list-style: none;
        font:
          400 14px/20px 'Mona Sans',
          -apple-system,
          'Segoe UI',
          sans-serif;
        color: rgb(31, 35, 40);
        background: #fff;
        border-radius: 6px;
        box-shadow: 0 0 0 1px #d1d9e0;
      }
      .gh .tree li {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 32px;
        padding: 0 8px 0 calc(var(--depth) * 8px);
        border-radius: 6px;
        cursor: pointer;
      }
      .gh .tree li:hover {
        background: rgb(129 139 152 / 0.1);
      }
      .gh .tree svg {
        flex: none;
        fill: currentColor;
      }
      .gh .chevron,
      .gh .file {
        color: rgb(89, 99, 110);
      }
      .gh .dir {
        color: rgb(84, 174, 255);
      }
      .gh .modified {
        color: rgb(154, 103, 0);
      }
      .gh .added {
        color: rgb(26, 127, 55);
      }
      .gh .spacer {
        flex: none;
        width: 16px;
      }
      .gh .name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .gh .guide {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 1px;
        background: rgb(209 217 224 / 0.7);
      }
      /* GitHub's own tooltip (Primer's TooltipV2), on the shipped tree. */
      .gh-tip {
        position: fixed;
        z-index: 10;
        max-width: 250px;
        padding: 4px 8px;
        border-radius: 6px;
        background: rgb(37, 41, 46);
        color: #fff;
        font:
          400 12px/1.5 'Mona Sans',
          -apple-system,
          'Segoe UI',
          sans-serif;
        overflow-wrap: break-word;
        pointer-events: none;
        animation: gh-tip 0.1s ease-in;
      }
      @keyframes gh-tip {
        from {
          opacity: 0;
        }
      }
      /* floating-ellipsis's tips go on <body>; these look like GitHub's overlays. */
      [data-fp-tip] {
        z-index: 10;
        padding: 6px 8px;
        color: rgb(31, 35, 40);
      }
      [data-fp-tip-bg] {
        background: #fff;
        border-radius: 6px;
        box-shadow:
          0 0 0 1px #d1d9e0,
          0 8px 24px rgb(66 74 83 / 0.12);
      }
      /* Vercel's domain search (Geist), as on vercel.com/domains. */
      .vc {
        font-family: Geist, Arial, sans-serif;
        color: rgb(23, 23, 23);
      }
      .vc .table {
        width: 328px;
        background: #fff;
        border: 1px solid rgb(230, 230, 230);
        border-radius: 6px;
      }
      .vc .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 4px;
        height: 56px;
        padding: 8px 12px;
        box-sizing: border-box;
      }
      .vc .row + .row {
        border-top: 1px solid rgb(235, 235, 235);
      }
      .vc .row .buy {
        display: flex;
        flex: none;
        align-items: center;
        gap: 8px;
        padding-left: 8px;
      }
      .vc .domain {
        flex: 1;
        min-width: 0;
        font-size: 14px;
        line-height: 21px;
        letter-spacing: -0.015em;
        font-variant-ligatures: none;
        font-kerning: none;
        white-space: nowrap;
      }
      .vc .domain b {
        font-weight: 600;
      }
      /* As shipped: the name less its last three letters truncates on its own. */
      .vc .shipped {
        display: inline-flex;
        align-items: center;
      }
      .vc .shipped .head-part {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .vc .shipped span:not(.head-part) {
        flex: none;
      }
      .vc .price {
        font-size: 14px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }
      /* Hovered, a row's price shows a renewal icon before it: its cell is always that wide. */
      .vc .row .price {
        padding-left: 16px;
      }
      .vc .cart {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        box-sizing: border-box;
        border: 1px solid rgb(230, 230, 230);
        border-radius: 6px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <section class="case" id="claude">
      <p class="source"><b>Claude Code</b><span>Background tasks panel, on claude.ai</span></p>
      <div class="compare">
        <figure>
          <figcaption>As shipped</figcaption>
          <div class="panel" id="claude-before"></div>
        </figure>
        <figure>
          <figcaption>With floating-ellipsis</figcaption>
          <div class="panel" id="claude-after"></div>
        </figure>
      </div>
    </section>
    <section class="case gh" id="github">
      <p class="source"><b>GitHub</b><span>Files changed in a pull request (spring-projects/spring-boot#52249)</span></p>
      <div class="compare">
        <figure>
          <figcaption>As shipped</figcaption>
          <ul class="tree" id="github-before" role="tree"></ul>
        </figure>
        <figure>
          <figcaption>With floating-ellipsis</figcaption>
          <ul class="tree" id="github-after" role="tree"></ul>
        </figure>
      </div>
    </section>
    <section class="case vc" id="vercel">
      <p class="source"><b>Vercel</b><span>Domain search (vercel.com/domains/search?q=toolongtofithereprobably)</span></p>
      <div class="compare">
        <figure>
          <figcaption>As shipped</figcaption>
          <div class="table" id="vercel-before"></div>
        </figure>
        <figure>
          <figcaption>With floating-ellipsis</figcaption>
          <div class="table" id="vercel-after"></div>
        </figure>
      </div>
    </section>
    <script type="module" src="./cases.ts"></script>
  </body>
</html>
