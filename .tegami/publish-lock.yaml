core:changelogs:
  - content: "---\npackages:\n  floating-ellipsis:\n    type: minor\n---\n\n### A tip waits for the pointer to rest, and can open only near an ellipsis\n\nA tip used to show once the pointer had been on its trigger for `delay`, even while the pointer kept moving. Every move now starts the wait again, so a pointer passing over truncated text doesn't open the tip. The new `hover: 'ellipsis'` option opens a full-text tip only on an ellipsis, on the character showing on either side of the ellipsis, or within `slop` of them. Once open, the tip stays open over the whole trigger. Text that is only shortened, with no ellipsis, opens the tip anywhere.\n"
    filename: tooltip-hover.md
    v: 0.0.0
core:packages:
  - changelogIds:
      - tooltip-hover.md
    id: npm:floating-ellipsis
    updated: true
